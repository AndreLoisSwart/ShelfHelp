[project]
name = "shelf-help"
version = "0.1.0"
description = "Personal project, item and notes manager"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
