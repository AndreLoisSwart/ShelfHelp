# Home Assistant add-on config. Lives at the repo root because HA uses this
# folder as the Docker build context, and the image needs backend/ and frontend/.
name: Shelf-help
version: "0.4.0"
slug: shelf_help
description: Personal project, item and notes manager
url: https://github.com/AndreLoisSwart/ShelfHelp
arch:
  - amd64
startup: application
boot: auto
# Stop the add-on during HA backups, so the SQLite file is never copied mid-write.
backup: cold
ingress: true
ingress_port: 8099
panel_icon: mdi:bookshelf
panel_title: Shelf-help
# Direct LAN access, disabled by default: it bypasses HA authentication.
# Enable it by setting a host port in the add-on's Network settings.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direct web access (no HA login)
